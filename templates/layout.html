
<!DOCTYPE html>
<html lang="en">

<head>

    
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap"
      rel="stylesheet">

    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
<link rel="icon" type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}">

    <!-- SEO -->
    <title>{% block title %}CarValue26 – Used Car Price Prediction in India{% endblock %}</title>

    <meta name="description"
        content="Predict used-car prices, compare vehicles, and explore car insights with CarValue26. Get an estimated market value based on vehicle specifications.">

    <meta name="keywords"
        content="CarValue26, used car price prediction India, used car valuation, AI car price estimator, compare used cars">

    <meta name="author" content="CarValue26">
    <meta name="application-name" content="CarValue26">
    <meta name="theme-color" content="#16a34a">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/favicon.png') }}">

    <!-- Social Sharing Preview -->
    <meta property="og:site_name" content="CarValue26">
    <meta property="og:type" content="website">
    <meta property="og:title"
        content="CarValue26 – Used Car Price Prediction in India">
    <meta property="og:description"
        content="Predict used-car prices, compare vehicles, and explore car insights with CarValue26.">

    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image"
        content="{{ url_for('static', filename='images/carvalue26-preview.jpg', _external=True) }}">
    <meta property="og:image:alt"
        content="CarValue26 used car price prediction platform">

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title"
        content="CarValue26 – Used Car Price Prediction in India">
    <meta name="twitter:description"
        content="Predict used-car prices, compare vehicles, and explore car insights with CarValue26.">
    <meta name="twitter:image"
        content="{{ url_for('static', filename='images/carvalue26-preview.jpg', _external=True) }}">

    <!-- Website Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CarValue26",
        "alternateName": "CarValue26 - Used Car Price Prediction",
        "url": "{{ request.url_root }}"
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/footer.css') }}">

    <!-- Extra CSS -->
    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- Navigation -->
    {% include 'components/navbar.html' %}

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <!-- Global JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>

    <!-- Extra JavaScript -->
    {% block extra_js %}
    {% endblock %}

</body>
</html>
