<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant - CarValue26</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/ai_assistant.css') }}"
>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

</head>

<body>

<div class="ai-app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-bar">

        <div class="brand">
            <div class="brand-icon">C</div>
            <span>CarValue26</span>
        </div>

        <div class="header-right">

            <span class="assistant-label">
                ChatValue AI
            </span>

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >
                + New Chat
            </button>

        </div>

    </header>


    <!-- =========================
         CHAT AREA
    ========================== -->

    <main class="chat-area" id="chatArea">

        <div class="chat-container">

            <!-- WELCOME -->

            <section
                class="welcome-screen"
                id="welcomeScreen"
            >

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask ChatValue AI anything about cars,
                    used-car prices, mileage, specifications,
                    comparisons and more.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        type="button"
                        data-question="What is the mileage of Ford Freestyle 1.5 diesel?"
                    >
                        🚗 Ford Freestyle mileage
                    </button>

                    <button
                        class="suggestion"
                        type="button"
                        data-question="What should I check before buying a used car?"
                    >
                        🔍 Used car buying tips
                    </button>

                    <button
                        class="suggestion"
                        type="button"
                        data-question="Which is better for long distance driving, petrol or diesel?"
                    >
                        ⛽ Petrol vs Diesel
                    </button>

                    <button
                        class="suggestion"
                        type="button"
                        data-question="How can I estimate the price of a used car?"
                    >
                        💰 Used car price
                    </button>

                </div>

            </section>


            <!-- MESSAGES -->

            <section
                class="messages"
                id="messages"
            >
            </section>

        </div>

    </main>


    <!-- =========================
         INPUT
    ========================== -->

    <div class="input-wrapper">

        <div class="input-container">

            <form
                class="chat-input-box"
                id="chatForm"
            >

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ask ChatValue AI anything about cars..."
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="send-btn"
                    id="sendBtn"
                    title="Send"
                >
                    ➤
                </button>

            </form>

            <div class="input-note">
                ChatValue AI can make mistakes. Check important information.
            </div>

        </div>

    </div>

</div>


<script>

    const chatForm =
        document.getElementById("chatForm");

    const messageInput =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const messages =
        document.getElementById("messages");

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    const chatArea =
        document.getElementById("chatArea");

    const newChatBtn =
        document.getElementById("newChatBtn");

    const suggestions =
        document.querySelectorAll(".suggestion");


    /* =========================
       SEND MESSAGE
    ========================== */

    async function sendMessage(question) {

        question = question.trim();

        if (!question) {
            return;
        }

        // Hide welcome screen
        welcomeScreen.style.display = "none";

        // Show messages
        messages.style.display = "flex";

        // Clear input
        messageInput.value = "";

        // Reset textarea height
        messageInput.style.height = "24px";

        // Add user message
        addUserMessage(question);

        // Show loading
        const loadingMessage =
            addLoadingMessage();

        sendBtn.disabled = true;
        messageInput.disabled = true;

        try {

            const response =
                await fetch(
                    "/api/ai-chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: question
                        })
                    }
                );


            const data =
                await response.json();


            // Remove loading message
            loadingMessage.remove();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "AI request failed"
                );

            }


            const answer =
                data.reply ||
                "I couldn't generate a response right now.";


            addAIMessage(answer);

        }

        catch (error) {

            console.error(
                "AI error:",
                error
            );

            loadingMessage.remove();

            addAIMessage(
                "Sorry, I couldn't connect to the AI right now. Please try again."
            );

        }

        finally {

            sendBtn.disabled = false;
            messageInput.disabled = false;

            messageInput.focus();

            scrollToBottom();
        }
    }


    /* =========================
       USER MESSAGE
    ========================== */

    function addUserMessage(question) {

        const message =
            document.createElement("div");

        message.className =
            "message user-message user";


        message.innerHTML = `

            <div class="message-content">

                <div class="message-name">
                    You
                </div>

                <div class="user-bubble">
                    ${escapeHTML(question)}
                </div>

            </div>

            <div class="message-avatar">
                You
            </div>

        `;


        messages.appendChild(message);

requestAnimationFrame(() => {
    message.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
});


        requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
    });
    }
    


    /* =========================
       AI MESSAGE
    ========================== */

    function addAIMessage(answer) {

    const message =
        document.createElement("div");

    message.className =
        "message ai-message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        "C";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        "ChatValue AI";


    const text =
        document.createElement("div");

    text.className =
        "ai-text";

    text.innerHTML =
        DOMPurify.sanitize(
            marked.parse(answer)
        );


    content.appendChild(name);
    content.appendChild(text);

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    
}

 

  
  
    


    /* =========================
       LOADING MESSAGE
    ========================== */

    function addLoadingMessage() {

        const message =
            document.createElement("div");

        message.className =
            "message ai-message";


        message.innerHTML = `

            <div class="message-avatar">
                C
            </div>

            <div class="message-content">

                <div class="message-name">
                    ChatValue AI
                </div>

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        messages.appendChild(message);

        scrollToBottom();

        return message;
    }


    /* =========================
       SUGGESTION BUTTONS
    ========================== */

    suggestions.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const question =
                        button.dataset.question;

                    messageInput.value =
                        question;

                    sendMessage(question);

                }
            );

        }
    );


    /* =========================
       FORM SUBMIT
    ========================== */

    chatForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            sendMessage(
                messageInput.value
            );

        }
    );


    /* =========================
       ENTER KEY
    ========================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                chatForm.requestSubmit();

            }

        }
    );


    /* =========================
       AUTO RESIZE TEXTAREA
    ========================== */

    messageInput.addEventListener(
        "input",
        function() {

            this.style.height =
                "24px";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    120
                ) + "px";

        }
    );


    /* =========================
       NEW CHAT
    ========================== */

    newChatBtn.addEventListener(
        "click",
        function() {

            messages.innerHTML = "";

            messages.style.display =
                "none";

            welcomeScreen.style.display =
                "flex";

            messageInput.value = "";

            messageInput.style.height =
                "24px";

            messageInput.focus();

        }
    );


    /* =========================
       SCROLL
    ========================== */

    function scrollToBottom() {

        setTimeout(
            () => {

                chatArea.scrollTo({
                    top:
                        chatArea.scrollHeight,
                    behavior:
                        "smooth"
                });

            },
            50
        );

    }


    /* =========================
       SECURITY
    ========================== */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    // Focus input when page opens
    messageInput.focus();

    function scrollToLatestMessage() {
    
    };
    


</script>

</body>
</html>
