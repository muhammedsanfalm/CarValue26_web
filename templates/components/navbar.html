<nav class="navbar">

    <!-- Logo -->
    <a href="/" class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="CarValue26 Logo">
    </a>

    <!-- Navigation Links -->

    
<button
    class="nav-menu-toggle"
    id="navMenuToggle"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false">
    ☰
</button>


<ul class="nav-links">

    <li>
        <a href="{{ url_for('home') }}"
           class="{% if request.endpoint == 'home' %}active{% endif %}">
            Home
        </a>
    </li>

    <li>
        <a href="{{ url_for('features') }}"
           class="{% if request.endpoint == 'features' %}active{% endif %}">
            Features
        </a>
    </li>

    <li>
        <a href="{{ url_for('market') }}"
           class="{% if request.endpoint == 'market' %}active{% endif %}">
            Market
        </a>
    </li>

    <li>
        <a href="{{ url_for('compare') }}"
           class="{% if request.endpoint == 'compare' or request.endpoint == 'compare_result' %}active{% endif %}">
            Compare
        </a>
    </li>

    <li>
        <a href="{{ url_for('ai_assistant') }}"
           class="{% if request.endpoint == 'ai_assistant' %}active{% endif %}">
            AI Assistant
        </a>
    </li>

    <li>
        <a href="{{ url_for('contact') }}"
           class="{% if request.endpoint == 'contact' %}active{% endif %}">
            Contact
        </a>
    </li>

</ul>

    <!-- Right Side -->
    <div class="nav-right">

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search any car..."
            >
        </div>

        {% if session.get('user') %}

    <span class="welcome-user">
        Welcome, {{ session['user']['name'] }}
    </span>

    <a href="{{ url_for('logout') }}" class="logout-btn">
    Logout
</a>

{% else %}

    <a href="{{ url_for('login') }}" class="login-btn">
        Login
    </a>

    <a href="{{ url_for('register') }}" class="register-btn">
        Register
    </a>

{% endif %}

    </div>

</nav>


<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("navMenuToggle");
    const links = document.querySelector(".nav-links");

    if (!toggle || !links) return;

    toggle.addEventListener("click", function () {
        const isOpen = links.classList.toggle("mobile-open");

        toggle.setAttribute("aria-expanded", String(isOpen));
        toggle.setAttribute(
            "aria-label",
            isOpen ? "Close navigation menu" : "Open navigation menu"
        );
        toggle.textContent = isOpen ? "✕" : "☰";
    });

    links.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            links.classList.remove("mobile-open");
            toggle.setAttribute("aria-expanded", "false");
            toggle.setAttribute("aria-label", "Open navigation menu");
            toggle.textContent = "☰";
        });
    });
});
</script>
